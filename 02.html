<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Script</title>
</head>
<body>
    
   <h1>Tipo de dados</h1>
    <p id="teste1">O valor é (a): </p>
    <p id="teste2">O valor é (b): </p>
    <p id="teste3">O valor é (c): </p>
    <p id="teste4">O valor é (d): </p>
    <p id="teste5">O valor é (e): </p>
    <p id="teste6">O valor é (f): </p>
    <p id="teste7">O valor é (g): </p>

<script type="text/javascript">

//criar variaveis

var a; //texto + número 
var b =1; //inteiro
var c =[1,8,44,47,51]; // vetor --array - números
var d =['Verde', 'Amarelo', 'Azul', 'Branco']; // vertor --array - texto
var e = 'Senac'; //texto pré definido 
var f = false; // lógico - true e false 
var g = null; //vazio sem valor

document.getElementById('teste1').innerHTML += a;
document.getElementById('teste2').innerHTML += b;
document.getElementById('teste3').innerHTML += c[2];
document.getElementById('teste4').innerHTML += d[2];
document.getElementById('teste5').innerHTML += e;
document.getElementById('teste6').innerHTML += f;
document.getElementById('teste7').innerHTML += g;


</script>


</body>
</html>
